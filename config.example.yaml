# Daemon settings. You can edit this by hand; the server reloads it on the next message.
# tools: enabled tools (execute_command, read_file, fetch_url)
# memory: persistent notes for chats (enabled, auto_save). Tasks never use them.
# search: web search (provider, brave_key, searxng_url, results, region). jobs: background jobs started with /job (max_running, timeout_minutes, tools). computer: mouse and keyboard control through the laptop agent (max_actions, blocked_keys).
# llm: the cloud model (base_url, api_key, model; Anthropic, Groq, NVIDIA...). elevenlabs: cloud voice with fallback to the local one (api_key, voice_id, local_only...). edge_tts: free Edge voice (enabled, voice, rate, pitch, fallback). uploads: photos and files sent from the dashboard and Signal (enabled, dir, max_mb, max_chars, vision). security: ask before risky tools (confirm, confirm_tools, confirm_seconds). care: Signal alerts when something breaks, weekly memory check, morning plan extras (watchdog, memory_review, briefing_extras, briefing_city...). stt_cloud: speech-to-text in the cloud with local fallback (api_key, base_url, model). satellite: laptop agent for the microphone and desktop tools (satellite_setup.py). auth: PIN lock for the dashboard (enabled: false turns it off). calendar: daily plan call (briefing, briefing_time). wake: wake word on this computer's microphone. signal: chat over Signal (signal_bot.py). tool_profiles: named tool sets for the web UI.
# app_aliases: names for open_app, e.g. spotify: spotify-launcher
# spotify / spotify_aliases: for the spotify_play tool (client_id + client_secret from developer.spotify.com, and your own names for links)
# Restart the server after changing stt/tts.
# notify: timezone, dashboard address and phone call (Twilio) settings. Keep this file private. Keys and tokens can live in .env instead: write api_key: ${NAME} here, NAME=value in .env.
# Note: when a setting changes from the web UI the file is rewritten, so your own comments are lost.

think: true
system_prompt: |
  You are a voice and chat assistant running on the user's Linux computer.

  Rules:
  - Give clear, technical and relevant answers.
  - Answer the question, without leaving the topic.
  - Your answers are spoken aloud. Keep them short (1-3 sentences), plain text only: no markdown, lists, tables or emoji.
  - When reporting command output, summarize the key points instead of repeating it.
